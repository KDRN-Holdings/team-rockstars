name = "tr-api"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Fill database_id in after `npx wrangler d1 create team-rockstars`.
[[d1_databases]]
binding = "DB"
database_name = "team-rockstars"
database_id = "ea0911ce-582c-4a9b-abc0-b6a0b2f9ab4b"

# Non-secret config. Secrets (RESEND_API_KEY) are set with `wrangler secret put`
# and must never be listed here.
[vars]
# Comma-separated list of allowed front-end origins. First entry is used to
# build password-reset links, so put the canonical app URL first.
APP_ORIGIN = "https://team-rockstars.pages.dev"
MAIL_FROM = "Team Rockstars <noreply@sculpt-rx.net>"
# "None" while Pages and the Worker are on different domains.
# Change to "Lax" once both are on sculpt-rx.net subdomains (see README step 9).
COOKIE_SAMESITE = "None"

# Housekeeping: expires sessions and spent reset tokens nightly.
[triggers]
crons = ["17 4 * * *"]
